name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: every job only reads the repository. A job that needs more must
# ask for it in its own `permissions:` block.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to full commit SHAs (a tag can be moved to other code; a commit
# cannot); the comment names the release. Dependabot (.github/dependabot.yml) opens
# the update PRs. tests/test_supply_chain.py enforces both.
jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    # ~4400 tests: about 13 min on ubuntu and 19 min on windows (projected from local
    # timings, Oct 2026). The limit stops a hung run long before GitHub's 6 h.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false
      # PySide6 (the GUI tests, run offscreen) needs the EGL/OpenGL system
      # libraries, which the ubuntu-latest image no longer preinstalls.
      - name: Install Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libgl1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
      - name: Create environment
        run: uv venv --python ${{ matrix.python }}
      - name: Install
        run: uv pip install -e ".[dev]"
      - name: Test (GPU tests auto-skip without a device)
        run: uv run pytest -q

  lint:
    name: lint + types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
      - name: Create environment
        run: uv venv --python 3.12
      - name: Install
        run: uv pip install -e ".[dev]"
      - name: Ruff
        run: uv run ruff check src tests
      - name: Mypy
        run: uv run mypy

  docs:
    name: docs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
      - name: Create environment
        run: uv venv --python 3.12
      - name: Install
        run: uv pip install -e ".[docs]"
      # -W turns broken cross-references / malformed docstrings into build failures.
      - name: Build (warnings are errors)
        run: uv run sphinx-build -b html -W --keep-going docs docs/_build/html
