# Build and publish cuPeriod to PyPI via Trusted Publishing (OIDC — no API tokens).
#
# One-time setup before this works:
#   1. Create the distribution project on PyPI and TestPyPI (a first manual upload, or
#      reserve the name).
#   2. Add a "Trusted Publisher" on each:
#        PyPI:     project → Settings → Publishing → add GitHub publisher
#        TestPyPI: same, on test.pypi.org
#      with  owner: tjayasinghe  repo: cuPeriod  workflow: release.yml
#      and environment names `pypi` / `testpypi` respectively.
#   3. Create matching GitHub Environments named `pypi` and `testpypi`
#      (Settings → Environments). Give `pypi` a required reviewer and a deployment
#      rule that only admits `v*` tags, so a tag push alone cannot publish.
#
# Usage:
#   * Bump `version` in pyproject.toml, merge, then push the tag `v<that version>`
#     → builds and publishes to PyPI. The build fails if the tag and the built
#     version differ (e.g. tagging v1.3.0 while pyproject still says 1.3.0.dev0).
#   * Run manually (workflow_dispatch) → builds and publishes to TestPyPI (a dry
#     run), never to PyPI, whichever branch or tag it is started on.
#
# Supply chain: actions are pinned to full commit SHAs (Dependabot updates them),
# uv to an exact version and its tarball's SHA-256, twine to an exact version, and
# the build backend to hashes (.github/build-constraints.txt). The build job holds
# no write token and restores no cache, so a moved tag, a new PyPI upload or another
# workflow run cannot change what is built and uploaded. tests/test_supply_chain.py
# enforces this. Dependabot does not touch the uv, twine or hatchling pins: bump
# them by hand, and always bump uv's `version` and `checksum` together.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

# Least privilege: the token only reads the repository. The two publish jobs add
# `id-token: write` (Trusted Publishing) and nothing else.
permissions:
  contents: read

jobs:
  build:
    name: build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
        with:
          # setup-uv's built-in checksum table stops at the uv releases that predate
          # the action, so a newer uv installs unverified unless `checksum` is set.
          # It is the SHA-256 of the x86_64 glibc tarball that ubuntu-latest
          # downloads, from uv's GitHub release (<asset>.sha256). Bump the two
          # together; a stale checksum fails the build rather than passing silently.
          version: "0.11.20"
          checksum: "5de211d9278af365497d387e25316907b3b4a9f25b4476dd6dbf238d6f85cff3"  # uv-x86_64-unknown-linux-gnu.tar.gz 0.11.20
          enable-cache: false
      - name: Build sdist + wheel
        run: uv build --build-constraints .github/build-constraints.txt --require-hashes
      - name: Check the tag matches the built version
        id: version-guard
        if: github.event_name == 'push'
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          sdist="dist/cuperiod-${version}.tar.gz"
          if [[ ! -f "$sdist" ]] || ! compgen -G "dist/cuperiod-${version}-*.whl" >/dev/null; then
            echo "::error::Tag $TAG does not match the version that was built. Set version = \"$version\" in pyproject.toml before tagging. dist/ holds:"
            printf '  %s\n' dist/*
            exit 1
          fi
          echo "Tag $TAG matches $sdist"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        with:
          name: dist
          path: dist/
      # Runs after the upload, so a third-party checker cannot alter what is
      # published; a failure still stops both publish jobs. --exclude-newer freezes
      # twine's own dependencies at that date.
      - name: Check metadata
        run: uvx --exclude-newer 2026-09-28T00:00:00Z twine==7.0.0 check dist/*

  testpypi:
    name: publish to TestPyPI (dry run)
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write   # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    name: publish to PyPI
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
