[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cuperiod"
version = "1.3.0.dev0"
description = "Optimized, GPU-accelerated periodograms for astronomy"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
authors = [{ name = "Tharindu Jayasinghe" }]
keywords = [
    "astronomy",
    "periodogram",
    "lomb-scargle",
    "box-least-squares",
    "variable-stars",
    "asteroseismology",
    "pulsations",
    "pre-whitening",
    "time-series",
    "gpu",
    "cuda",
    "rocm",
    "amd",
    "intel",
    "metal",
    "array-api",
    "pytorch",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "astropy>=6.0",
    "finufft>=2.2",
    # Array-API dispatch: the portable (numpy/cupy/torch) compute paths run through one
    # standard namespace. Lightweight, pure-Python — always installed.
    "array-api-compat>=1.9",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    # 0.16: older typer releases leave click uncapped but break on click 8.2+ (every
    # --help and usage error, or every command, raises).
    "typer>=0.16",
    # 14.0.1, not 14: pyarrow 0.14.0-14.0.0 unpickle extension-type metadata while
    # reading Parquet/IPC (CVE-2023-47248), and cuPeriod opens user .parquet files.
    "pyarrow>=14.0.1",
]

[project.optional-dependencies]
# GPU acceleration. The cufinufft Windows wheel needs the CUDA-12 runtime DLLs on
# the search path; importing cupy (and cuperiod's DLL shim) completes the setup.
gpu = [
    "cupy-cuda12x>=13.3",
    "cufinufft>=2.3",
    "nvidia-cuda-runtime-cu12",
    "nvidia-cufft-cu12",
    "nvidia-cuda-nvrtc-cu12",
    "nvidia-cublas-cu12",
    "nvidia-cusolver-cu12",
]
pandas = ["pandas>=2.0"]
# LINCC-stack interoperability (cuperiod.interop): run periodograms directly on
# nested-pandas ``NestedFrame`` light curves, one row per object. The nested extension
# arrays this adapter reads (list offsets / struct fields) need a newer pyarrow than
# the core floor, so the bound is raised here only.
nested = ["nested-pandas>=0.6.10", "pyarrow>=16"]
# The same adapter against an lsdb HATS catalog (lazy, dask-partitioned). lsdb pins
# nested-pandas itself; the [nested] extra keeps the floor consistent.
lsdb = ["cuperiod[nested]", "lsdb>=0.10.0"]
# Multicore CPU acceleration: numba-parallel kernels for BLS, PDM, CE, String-Length,
# MHAOV, TLS and SuperSmoother, auto-selected as the "cpu"/"auto" backend when present
# (otherwise those methods fall back to numpy / astropy's BoxLeastSquares). GLS is
# unaffected — its CPU path is finufft.
# scipy 1.13: with numba's thread pool, the OpenBLAS bundled with older scipy can exceed
# its compiled thread count on many-core machines and crash the process at exit.
fast = ["numba>=0.59", "scipy>=1.13"]
# Portable accelerator reaching AMD (ROCm), Intel (XPU), Apple (MPS), and a fast CPU
# path. Install the wheel matching your accelerator from https://pytorch.org/ — the
# plain wheel is CPU-only; CUDA/ROCm/XPU builds come from PyTorch's own index, so we do
# not pin a hardware-specific build here.
torch = ["torch>=2.2"]
# Desktop GUI: an interactive periodogram explorer (`cuperiod-gui`). PySide6 is the
# Qt6 toolkit (LGPL); pyqtgraph renders the full-resolution spectrum and light-curve
# panels at interactive speed; pandas backs the demo-data adapters and grouped-batch
# input. Purely a presentation layer over the existing API — no core dependency.
# PySide6 6.7 for QTimer.singleShot(msec, context, callable); pyqtgraph 0.13.7 for
# PySide6 6.7. PySide6 6.12.0 drops a reference to None whenever a Qt call returns
# null, which aborts Python 3.11 (None is not immortal before 3.12) within seconds of
# GUI use, so 3.11 stays below 6.12.
gui = [
    "PySide6>=6.7,<6.12; python_version < '3.12'",
    "PySide6>=6.7; python_version >= '3.12'",
    "pyqtgraph>=0.13.7",
    "pandas>=2.0",
]
# Static diagnostic figures for the period-change tools (cuperiod.pdot.plots, and
# the --plots option of `cuperiod pdot-batch`). Imported lazily, so everything
# else works without it. 3.6 is the floor for Figure(layout="constrained").
plot = ["matplotlib>=3.6"]
# Documentation toolchain (Sphinx + Furo theme). pandas is included so the
# DataFrame-ingestion examples and the autodoc of from_dataframe build cleanly.
docs = [
    "sphinx>=8",
    "furo>=2024.8",
    "myst-parser>=4",
    "sphinx-copybutton>=0.5",
    "sphinx-design>=0.6",
    "pandas>=2.0",
]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas>=2.0",
    "hypothesis>=6",
    "numba>=0.59",
    # Exercise the LINCC interoperability adapter (tests/test_interop.py) in CI
    # against the current nested-pandas line; the adapter itself stays
    # 0.6.10-compatible for the lsdb (pandas-2) world.
    "nested-pandas>=0.7",
    # SuperSmoother reference implementations (BSD-2-Clause), test-only: the native
    # kernel is pinned against them exactly (tests/test_supersmoother.py). gatspy
    # ships no install_requires; its scipy/astropy needs are core deps here anyway.
    "supersmoother>=0.4",
    "gatspy>=0.3",
    # Exercise the portable torch-CPU path in CI (GPU devices auto-skip).
    "torch>=2.2",
    # Drive the Qt GUI headlessly (QT_QPA_PLATFORM=offscreen) in tests; the same
    # bounds as the [gui] extra. pytest-qt 4.2 is the first that loads under pytest 8.
    "PySide6>=6.7,<6.12; python_version < '3.12'",
    "PySide6>=6.7; python_version >= '3.12'",
    "pyqtgraph>=0.13.7",
    "pytest-qt>=4.2",
    # Render the period-change diagnostic figures (cuperiod.pdot.plots).
    "matplotlib>=3.6",
]

[project.scripts]
cuperiod = "cuperiod.cli.app:main"
cuperiod-gui = "cuperiod.gui:main"

[project.urls]
Homepage = "https://github.com/tjayasinghe/cuPeriod"
Documentation = "https://cuperiod.readthedocs.io"
Repository = "https://github.com/tjayasinghe/cuPeriod"
Issues = "https://github.com/tjayasinghe/cuPeriod/issues"
Changelog = "https://github.com/tjayasinghe/cuPeriod/blob/main/CHANGELOG.md"

# The [lsdb] extra transitively pins nested-pandas <0.7 (the pandas-2 world),
# while [dev] tests against current nested-pandas (pandas 3). Declaring them
# conflicting lets uv fork the lock instead of downgrading pandas for everyone.
[tool.uv]
conflicts = [[{ extra = "lsdb" }, { extra = "dev" }]]

[tool.hatch.build.targets.wheel]
packages = ["src/cuperiod"]

# Without an explicit allowlist the sdist sweeps in the whole working tree (.venv,
# benchmark data, build output). Ship only the source, tests, and project metadata.
[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/CITATION.cff",
    "/pyproject.toml",
]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "NPY"]

[tool.ruff.lint.per-file-ignores]
# typer's API requires function calls (Option/Argument) in parameter defaults.
"src/cuperiod/cli/app.py" = ["B008"]

# Type-checked against 3.12 (matches numpy>=2.3 stubs, which use 3.12 syntax);
# 3.11 source compatibility is enforced by requires-python and ruff target-version.
[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = false
files = ["src/cuperiod"]
plugins = ["pydantic.mypy"]

# Third-party packages without (complete) type stubs.
[[tool.mypy.overrides]]
module = [
    "finufft",
    "cufinufft",
    "cupy",
    "cupy.*",
    "cupyx",
    "cupyx.*",
    "pandas",
    "astropy",
    "astropy.*",
    "scipy",
    "scipy.*",
    "torch",
    "torch.*",
    "array_api_compat",
    "array_api_compat.*",
    # LINCC stack (cuperiod.interop): neither ships type stubs.
    "nested_pandas",
    "nested_pandas.*",
    "lsdb",
    "lsdb.*",
]
ignore_missing_imports = true

# numba: whether or not the installed release ships py.typed (0.66 added it), its
# jit/prange decorators leave the wrapped callables untyped (prange trips
# no-untyped-call / attr-defined in a typed context). Skip following into it and
# accept it stub-less so the module stays Any on every numba version.
[[tool.mypy.overrides]]
module = ["numba", "numba.*"]
follow_imports = "skip"
ignore_missing_imports = true

# pyarrow: up to 24 it ships py.typed but leaves read_table/write_table untyped, and
# 26 dropped py.typed altogether; skip it and accept it stub-less either way.
[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
follow_imports = "skip"
ignore_missing_imports = true

# pyqtgraph ships no type stubs.
[[tool.mypy.overrides]]
module = ["pyqtgraph", "pyqtgraph.*"]
ignore_missing_imports = true

# The GUI subclasses pyqtgraph view classes (untyped -> Any); strict mode's
# disallow_subclassing_any would reject that. Everything else stays strict.
[[tool.mypy.overrides]]
module = ["cuperiod.gui.*"]
disallow_subclassing_any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: requires a CUDA GPU with the [gpu] extra installed (deselect with -m 'not gpu')",
]
filterwarnings = ["ignore::DeprecationWarning"]
